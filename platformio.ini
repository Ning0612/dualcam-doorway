; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      =
  bblanchon/ArduinoJson@^7
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit NeoPixel@^1.12

[env:agent1]
; DISCORD_TLS_INSECURE: dev/test only — remove and define DISCORD_ROOT_CA_CERT for production
; BOARD_HAS_PSRAM + -mfix-esp32-psram-cache-issue: required for AI Thinker / NMK99 PSRAM access
build_flags      = -I include -D AGENT1 -D DISCORD_TLS_INSECURE
                   -D BOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
build_src_filter = -<*> +<main.cpp>
